<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVPs: hosts only</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6E9">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
<main class="dash">

  <header class="dash__head">
    <h1 class="dash__title" id="dashTitle">The guest list</h1>
    <p class="dash__sub">Hosts only</p>
  </header>

  <!-- ---- passphrase gate ------------------------------------------- -->
  <section class="gate" id="gate">
    <form id="gateForm">
      <div class="field">
        <label for="key">Passphrase</label>
        <input type="password" id="key" autocomplete="current-password"
               placeholder="The ADMIN_KEY from Code.gs">
        <p class="err" id="gateErr" hidden></p>
      </div>
      <button class="btn btn--primary btn--wide" type="submit" id="gateBtn">Show me the list</button>
      <p class="hint" style="text-align:center;margin-top:1rem">
        This is a doorknob lock, not a vault. It keeps a stray visitor out, so
        don't put anything here you'd mind a determined guest reading.
      </p>
    </form>
  </section>

  <!-- ---- the data --------------------------------------------------- -->
  <section id="panel" hidden>

    <div class="stats" id="stats"></div>

    <div class="dash__bar">
      <div class="field">
        <label for="search" class="sr-only">Search</label>
        <input type="text" id="search" placeholder="Search a name, email, note…">
      </div>
      <div style="display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center">
        <button class="linkbtn" type="button" id="btnRefresh">Refresh</button>
        <button class="linkbtn" type="button" id="btnCsv">Download CSV</button>
        <button class="linkbtn" type="button" id="btnPrint">Print</button>
        <button class="linkbtn" type="button" id="btnLogout">Lock</button>
      </div>
    </div>

    <div class="tablewrap">
      <table id="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Going</th>
            <th>People</th>
            <th>Bringing</th>
            <th>Contact</th>
            <th>Notes for hosts</th>
            <th>RSVP'd</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>Nothing matches that.</p>

    <div class="messages" id="messages">
      <h2 class="section-title">Messages for the birthday book</h2>
      <div class="rule" aria-hidden="true"></div>
      <div id="msgList"></div>
    </div>

  </section>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/rsvps.js"></script>
</body>
</html>
